services:
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: flexibleInventory_sqlserver
        environment:
            MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
            MSSQL_PID: "Developer"
            ACCEPT_EULA: "Y"
        ports:
            - "${MSSQL_PORT:-0}:1433"
        volumes:
            - sqlserver_data:/var/opt/mssql
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" > /dev/null 2>&1"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 15s

    db-init:
        image: mcr.microsoft.com/mssql-tools:latest
        container_name: flexibleInventory_db_init
        depends_on:
            sqlserver:
                condition: service_healthy
        environment:
            MSSQL_HOST: sqlserver
            MSSQL_PORT: "1433"
            MSSQL_USER: sa
            MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
            MSSQL_DB_NAME: ${MSSQL_DB_NAME}
        volumes:
            - ./Database:/Database:ro
        entrypoint: ["/bin/bash", "/Database/Scripts/DatabaseInitialization/init-db.sh"]
        restart: "no"

    api:
        build:
            context: .
            dockerfile: src/FlexibleInventory.Api/Dockerfile
        container_name: flexible-inventory-api
        depends_on:
            sqlserver:
                condition: service_healthy
            db-init:
                condition: service_completed_successfully
        environment:
            ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
            ASPNETCORE_URLS: http://+:8080
            ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${MSSQL_DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
        ports:
        - "${API_HTTP_PORT:-8080}:8080"

volumes:
    sqlserver_data: